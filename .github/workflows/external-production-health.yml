name: external-production-health

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Allow Railway deployment to start
        if: github.event_name == 'push'
        run: sleep 90
      - name: Verify Hermes and Manifest from outside Railway
        env:
          HERMES_STATUS_URL: https://hermes-agent-production-8657.up.railway.app/api/status
          MANIFEST_HEALTH_URL: https://manifestdotbuildmanifest-production-ea82.up.railway.app/api/v1/health
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request

          def fetch(url):
              request = urllib.request.Request(url, headers={"User-Agent": "Hermes-External-Health/1"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{url}: HTTP {response.status}")
                  return json.load(response)

          consecutive = 0
          last_error = "no successful probe"
          for attempt in range(12):
              try:
                  hermes = fetch(os.environ["HERMES_STATUS_URL"])
                  manifest = fetch(os.environ["MANIFEST_HEALTH_URL"])
                  if hermes.get("overall") != "ok" or not hermes.get("gateway_running"):
                      raise RuntimeError("Hermes public status is not healthy")
                  if manifest.get("status") != "healthy":
                      raise RuntimeError("Manifest public status is not healthy")
                  consecutive += 1
                  print(f"external health pass {consecutive}/3 (attempt {attempt + 1}/12)")
                  if consecutive == 3:
                      break
              except Exception as exc:
                  consecutive = 0
                  last_error = f"{type(exc).__name__}: {exc}"
                  print(f"transient health failure (attempt {attempt + 1}/12): {last_error}")
              if attempt < 11:
                  time.sleep(30)
          else:
              raise RuntimeError(f"external health never stabilized: {last_error}")
          PY
